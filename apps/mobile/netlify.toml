# Netlify configuration for the Game app (Expo web export)
# This file is only used when deploying the game site.

[build]
  command = "pnpm install && pnpm --filter @trivial-world/types build && pnpm build"
  publish = "dist"

[build.environment]
  # Node 22 required by @netlify/database (engines >=22.12)
  NODE_VERSION = "22"

[functions]
  node_bundler = "esbuild"

# Security headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
